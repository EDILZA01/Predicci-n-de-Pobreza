name: MLOps Continuous Integration & Training Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  mlops-pipeline:
    name: Automated Data, Testing & Training Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Data Extraction & Preprocessing Pipeline
        run: |
          python src/preprocess.py

      - name: 5. Execute Automated Test Suite (CI Quality Gate)
        run: |
          pytest -v tests/

      - name: 6. Continuous Training & Model Evaluation (CT)
        run: |
          python src/train.py
          python src/evaluate.py

      - name: 7. MLOps Artifacts Verification Gate
        run: |
          echo "Verificando artefactos de producción y reportes visuales..."
          test -s models/poverty_model.joblib || { echo "Error: models/poverty_model.joblib no existe o está vacío"; exit 1; }
          test -s reports/figures/confusion_matrix_knn.png || { echo "Error: confusion_matrix_knn.png no existe o está vacío"; exit 1; }
          test -s reports/figures/roc_curve_knn.png || { echo "Error: roc_curve_knn.png no existe o está vacío"; exit 1; }
          test -s reports/figures/models_f1_comparison.png || { echo "Error: models_f1_comparison.png no existe o está vacío"; exit 1; }
          echo "Todos los artefactos requeridos (modelo serializado y figuras de evaluación) fueron validados exitosamente."
